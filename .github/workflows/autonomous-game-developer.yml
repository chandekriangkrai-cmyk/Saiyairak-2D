name: Autonomous Game Developer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomous-game-developer.yml"
  schedule:
    # 03:00 UTC = 10:00 Asia/Bangkok
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: autonomous-game-developer
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      RENDER_URL: ${{ vars.RENDER_URL || 'https://school-time-8zt2.onrender.com' }}
      MAX_AI_CALLS: "3"
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "autonomous-game-developer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: metaverse
        run: bun install --frozen-lockfile

      - name: Autonomous development cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/autonomous_developer.py

      - name: Validate generated diff
        id: diff
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff --check
            changed="$(git status --porcelain --untracked-files=all | awk '{print $NF}')"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Ev '^(metaverse/apps/web/src/|metaverse/apps/web/public/)' ; then
              echo "::error::Generated changes include files outside the allowlist."
              exit 1
            fi
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No safe change produced; no pull request needed."
          fi

      - name: Open or update review pull request
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/saiyairak2d-improvement
          delete-branch: true
          add-paths: |
            metaverse/apps/web/src
            metaverse/apps/web/public
          commit-message: "feat: autonomous game improvement"
          title: "Review autonomous Saiyairak-2D improvement"
          body: |
            ## Automated change — review required

            This change was generated by the scheduled development workflow.

            - Typecheck and frontend build were run by the generator before this PR was opened.
            - Please review the diff and required CI checks before merging.
            - This workflow does not deploy or push generated code directly to `main`.

      - name: Verify existing Render health (read-only; no deployment)
        if: success()
        run: |
          echo "Checking Render health endpoint with bounded retries..."
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "$RENDER_URL/healthz"; then
              echo
              echo "Render health check passed on attempt $attempt."
              exit 0
            fi
            echo "Health check attempt $attempt failed; waiting 10 seconds."
            sleep 10
          done
          echo "::error::Render health check did not pass after 6 attempts."
          exit 1
