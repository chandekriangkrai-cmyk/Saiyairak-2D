# Paid external AI APIs are intentionally disabled for FUN CLASS 2D.
# No scheduled or push-triggered AI calls. Manual runs perform offline checks only.
name: Autonomous Game Developer (API Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies (offline AI)
        working-directory: metaverse
        run: bun install --frozen-lockfile
      - name: Offline autonomous developer tests (no API calls)
        run: python3 -m unittest discover -s scripts -p 'test_autonomous_developer.py'
