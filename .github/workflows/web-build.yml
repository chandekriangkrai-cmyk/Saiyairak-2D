name: Web Build

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, ai/dev-loop, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: metaverse
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - run: bun install --frozen-lockfile
      - name: Run Bun unit and regression tests
        run: bun test
      - run: bun run --cwd apps/web check-types
      - run: bun run --cwd apps/web build

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build Saiyairak 2D production container
        run: docker build -f deploy/render/Dockerfile -t school-time:ci .
      - name: Validate deployment files
        run: |
          test -x deploy/render/start.sh
          test -f deploy/render/nginx.conf
          test -f render.yaml
          git diff --check
