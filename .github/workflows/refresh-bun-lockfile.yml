name: Refresh Bun lockfile (release repair)

on:
  push:
    branches: [fix/release-gates-2026-10-14]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-gates-2026-10-14
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Regenerate lockfile with the pinned Bun version
        working-directory: metaverse
        run: bun install
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- metaverse/bun.lock; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metaverse/bun.lock
          git commit -m "build: refresh Bun lockfile with Bun 1.3.14"
          git push origin HEAD:fix/release-gates-2026-10-14
