name: Refresh Bun lockfile (release repair)

on:
  push:
    branches: [fix/release-gates-2026-10-14]
    paths:
      - ".github/workflows/refresh-bun-lockfile.yml"
      - "metaverse/package.json"
      - "metaverse/apps/**/package.json"
      - "metaverse/packages/**/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bun-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-gates-2026-10-14
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - name: Regenerate lockfile
        working-directory: metaverse
        run: bun install
      - name: Validate and commit only the lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- metaverse/bun.lock; then
            echo "No lockfile changes generated; refusing to create an empty commit."
            exit 1
          fi
          git diff --stat -- metaverse/bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metaverse/bun.lock
          git commit -m "fix: regenerate Bun workspace lockfile"
          git push origin HEAD:fix/release-gates-2026-10-14
