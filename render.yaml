services:
  - type: web
    name: school-time
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-time-db
          property: connectionString
      - key: JWT_PASSWORD
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info


databases:
  - name: school-time-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: schooltime
    user: schooltime
