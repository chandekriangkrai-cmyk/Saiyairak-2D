<g fill="#f6d98b"><circle cx="220" cy="105" r="10"/><circle cx="560" cy="105" r="10"/><circle cx="900" cy="105" r="10"/></g><g fill="#fff1bd" opacity=".16"><circle cx="220" cy="105" r="32"/><circle cx="560" cy="105" r="32"/><circle cx="900" cy="105" r="32"/></g>
