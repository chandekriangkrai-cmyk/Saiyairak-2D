    <rect x="2" y="2" width="36" height="36" rx="3" fill="#4a3025" stroke="#7c5238" stroke-width="2"/>
  </pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-opacity=".38"/></filter>
</defs>
<!-- floor and walls -->
<rect width="1120" height="800" fill="url(#floor)"/>
