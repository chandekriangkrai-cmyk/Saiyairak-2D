<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="800" viewBox="0 0 1120 800">
<defs>
  <pattern id="floor" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="#6b432c"/>
    <path d="M0 2H40 M0 20H40 M2 0V40 M22 0V40" stroke="#85563a" stroke-width="2" opacity=".55"/>
    <path d="M0 38H40 M38 0V40" stroke="#4e2f21" stroke-width="1" opacity=".6"/>
  </pattern>
  <pattern id="wall" width="40" height="40" patternUnits="userSpaceOnUse">
