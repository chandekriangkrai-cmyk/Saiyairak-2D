<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800">
<defs>
  <pattern id="floor" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#6b432c"/><path d="M0 2H40M0 20H40M2 0V40M22 0V40" stroke="#85563a" stroke-width="2" opacity=".55"/><path d="M0 38H40M38 0V40" stroke="#4e2f21" opacity=".6"/></pattern>
  <pattern id="wall" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#2b1d1a"/><rect x="2" y="2" width="36" height="36" rx="3" fill="#4a3025" stroke="#7c5238" stroke-width="2"/></pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-opacity=".38"/></filter>
  <filter id="soft"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity=".3"/></filter>
  <g id="cup"><ellipse cx="16" cy="22" rx="14" ry="5" fill="#3b2119" opacity=".35"/><rect x="4" y="5" width="24" height="17" rx="4" fill="#efe3ce" stroke="#4b3025" stroke-width="2"/><path d="M28 9q10 0 7 8q-2 5-7 3" fill="none" stroke="#efe3ce" stroke-width="4"/><ellipse cx="16" cy="6" rx="11" ry="4" fill="#6b3b28"/><path d="M13 1q-3-8 3-11M19 1q-1-7 4-10" stroke="#fff1d2" stroke-width="2" opacity=".55"/></g>
  <g id="cake"><ellipse cx="25" cy="30" rx="24" ry="7" fill="#3b2119" opacity=".28"/><path d="M7 10h36v17q-18 8-36 0z" fill="#f0b5a2" stroke="#4b3025" stroke-width="2"/><path d="M7 10q18 9 36 0" fill="#ffe0c5" stroke="#4b3025" stroke-width="2"/><path d="M13 7q5-7 10 0q5-7 10 0" fill="#7b3d34"/><circle cx="25" cy="6" r="3" fill="#f6d98b"/></g>
  <g id="pastry"><ellipse cx="22" cy="27" rx="20" ry="6" fill="#3b2119" opacity=".25"/><path d="M5 18q3-14 17-14t17 14q-4 8-17 8T5 18z" fill="#d9944c" stroke="#5a3422" stroke-width="2"/><path d="M10 17q12-7 24 0M13 22q9-5 18 0" fill="none" stroke="#f3c77a" stroke-width="3"/></g>
  <g id="plant"><rect x="9" y="24" width="22" height="15" rx="4" fill="#a96b3c" stroke="#4b2b1e" stroke-width="2"/><path d="M20 25V9M20 17Q8 13 9 5Q18 6 20 17M21 18Q34 12 34 4Q25 5 21 18M19 20Q9 20 4 13Q13 10 19 20" fill="#4f914b" stroke="#32633a" stroke-width="2"/></g>
  <g id="machine"><ellipse cx="45" cy="66" rx="40" ry="8" fill="#291c19" opacity=".35"/><rect x="7" y="12" width="76" height="55" rx="8" fill="#31363a" stroke="#15191c" stroke-width="4"/><rect x="17" y="22" width="56" height="18" rx="4" fill="#59636a"/><circle cx="28" cy="31" r="5" fill="#f1d18a"/><circle cx="44" cy="31" r="5" fill="#8fd1df"/><circle cx="60" cy="31" r="5" fill="#d47a63"/><rect x="24" y="44" width="12" height="15" rx="3" fill="#b8c0c4"/><rect x="52" y="44" width="12" height="15" rx="3" fill="#b8c0c4"/></g>
</defs>
<rect width="1120" height="800" fill="url(#floor)"/>
<rect width="1120" height="80" fill="url(#wall)"/><rect width="40" height="800" fill="url(#wall)"/><rect x="1080" width="40" height="800" fill="url(#wall)"/><rect y="760" width="1120" height="40" fill="url(#wall)"/>
